name: Offline Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Syntax check (all modules)
        run: python -m compileall -q core crawler pipeline service api_server.py config.py main.py run_cli.py run_server.py report_from_raw.py tests_offline.py

      - name: Run offline tests
        run: python tests_offline.py
