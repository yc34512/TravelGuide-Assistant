<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅游攻略助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
         background: #f4f6f8; color: #22303c; }
  header { background: #1f7a5c; color: #fff; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header span { font-size: 12px; opacity: .85; margin-left: 10px; }
  main { max-width: 880px; margin: 0 auto; padding: 18px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 14px;
          box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1; min-width: 220px; padding: 11px 14px; font-size: 16px;
                     border: 1px solid #cfd8de; border-radius: 8px; outline: none; }
  input[type=text]:focus { border-color: #1f7a5c; }
  button { background: #1f7a5c; border: 0; color: #fff; font-size: 16px;
           padding: 11px 22px; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #9bb8ae; cursor: not-allowed; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { background: #eef1f3; color: #5b6b78; border: 0; font-size: 14px; padding: 8px 18px;
         border-radius: 8px 8px 0 0; cursor: pointer; }
  .tab.active { background: #1f7a5c; color: #fff; }
  .opts { margin-top: 12px; font-size: 13px; color: #5b6b78; display: flex;
          gap: 16px; flex-wrap: wrap; align-items: center; }
  .opts input[type=number] { width: 64px; padding: 5px 8px; border: 1px solid #cfd8de;
                             border-radius: 6px; }
  .stage { font-weight: 600; color: #1f7a5c; margin-bottom: 8px; }
  .stage.err { color: #c0392b; }
  pre.log { background: #0f1e18; color: #9fe3c4; font-size: 12px; line-height: 1.7;
            max-height: 220px; overflow: auto; padding: 12px; border-radius: 8px;
            white-space: pre-wrap; margin: 0; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: #5b6b78;
           margin-bottom: 12px; }
  .stats b { color: #1f7a5c; }
  article { line-height: 1.85; font-size: 15px; }
  article h1 { font-size: 20px; } article h2 { font-size: 17px; border-left: 4px solid #1f7a5c;
           padding-left: 8px; }
  article blockquote { background: #f2f7f5; margin: 8px 0; padding: 8px 14px;
                       border-radius: 8px; color: #5b6b78; font-size: 13px; }
  article a { color: #1f7a5c; word-break: break-all; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; align-items: center;
             padding: 9px 4px; border-bottom: 1px solid #eef1f3; font-size: 14px; gap: 8px; }
  .hist li:last-child { border-bottom: 0; }
  .hist .kw { font-weight: 600; cursor: pointer; color: #1f7a5c; }
  .hist .kw:hover { text-decoration: underline; }
  .hist .meta { color: #93a3ae; font-size: 12px; white-space: nowrap; }
  .mini-btn { background: #fff; border: 1px solid #1f7a5c; color: #1f7a5c; font-size: 13px;
              padding: 5px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .mini-btn:hover { background: #eef6f2; }
  button.mini-btn.danger { border-color: #c0392b; color: #c0392b; }
  button.mini-btn.danger:hover { background: #fdf1ef; }
  .card h3 { margin: 0 0 10px; font-size: 15px; color: #22303c; }
  .hidden { display: none; }
  footer { text-align: center; color: #93a3ae; font-size: 12px; padding: 14px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #cfe6dd;
          border-top-color: #1f7a5c; border-radius: 50%; animation: r 1s linear infinite;
          vertical-align: -2px; margin-right: 6px; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header><h1>旅游攻略助手<span>抖音 UGC 挖掘 · AI 整合 · 来源可溯</span></h1></header>
<main>
  <div class="card">
    <div class="tabs">
      <button id="tab-research" class="tab active" onclick="switchTab('research')">攻略报告</button>
      <button id="tab-trip" class="tab" onclick="switchTab('trip')">行程规划</button>
    </div>
    <div id="form-research">
      <div class="row">
        <input type="text" id="kw" placeholder="输入景点关键词，如：西湖攻略" onkeydown="if(event.key==='Enter')go()">
        <button id="btn" onclick="go()">生成攻略报告</button>
      </div>
      <div class="opts">
        <label><input type="radio" name="mode" value="fast"> 快速 · 约3分钟 · 5条视频</label>
        <label><input type="radio" name="mode" value="standard" checked> 标准 · 约6分钟 · 8条视频</label>
        <label><input type="radio" name="mode" value="deep"> 深度 · 约15~25分钟 · 含口播转写（出发前用）</label>
      </div>
      <div class="opts">
        <label><input id="force" type="checkbox"> 忽略知识库缓存，强制重新采集</label>
      </div>
    </div>
    <div id="form-trip" class="hidden">
      <div class="row">
        <input type="text" id="city" placeholder="目的地城市，如：大同" style="flex:0 0 160px;">
        <input type="number" id="days" value="2" min="1" max="7" style="width:60px;padding:11px 8px;border:1px solid #cfd8de;border-radius:8px;"> 天
        <input type="text" id="hotel" placeholder="酒店/住宿位置（用于排线，如：大同古城内）" style="flex:1;min-width:200px;">
      </div>
      <div class="opts">
        <input type="text" id="prefs" placeholder="偏好（可选）：如 带老人、喜欢历史、想拍日落" style="flex:1;min-width:240px;padding:9px 12px;border:1px solid #cfd8de;border-radius:6px;">
      </div>
      <div class="opts">
        <input type="text" id="spots" placeholder="指定景点（可选，顿号/逗号分隔）；留空则自动圈定" style="flex:1;min-width:240px;padding:9px 12px;border:1px solid #cfd8de;border-radius:6px;">
        <button id="tripBtn" onclick="goTrip()">生成行程规划</button>
      </div>
      <div class="opts">7 天内调研过的景点自动命中缓存；未命中的逐个调研（约 5 分钟/个），全程可取消。</div>
    </div>
  </div>

  <div id="progress" class="card hidden">
    <div class="row" style="justify-content: space-between;">
      <div class="stage" id="stage"></div>
      <button id="cancelBtn" class="mini-btn" onclick="cancelJob()">取消任务</button>
    </div>
    <pre class="log" id="log"></pre>
  </div>

  <div id="result" class="card hidden">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <div class="stats" id="stats" style="margin-bottom: 0;"></div>
      <a id="dl" class="mini-btn" style="text-decoration: none;" download>下载 Markdown</a>
    </div>
    <article id="report"></article>
  </div>

  <div id="history" class="card hidden">
    <h3>历史报告（知识库）</h3>
    <ul class="hist" id="hist"></ul>
  </div>
</main>
<footer>报告由 AI 汇总抖音公开内容生成，仅供参考；价格/政策等时效信息出发前请务必官方核实。</footer>
<script>
const $ = id => document.getElementById(id);
let currentJobId = null;  // 当前正在轮询的任务，供取消按钮使用
let currentTab = 'research';

function switchTab(t) {
  currentTab = t;
  $('form-research').classList.toggle('hidden', t !== 'research');
  $('form-trip').classList.toggle('hidden', t !== 'trip');
  $('tab-research').classList.toggle('active', t === 'research');
  $('tab-trip').classList.toggle('active', t === 'trip');
}

function renderMd(md) {
  return window.marked ? marked.parse(md) : '<pre style="white-space:pre-wrap">' + md + '</pre>';
}

async function go() {
  const kw = $('kw').value.trim();
  if (!kw) { $('kw').focus(); return; }
  $('btn').disabled = true;
  // 含义：将“取消任务”按钮的 disabled 属性设为 false，即启用该按钮，允许用户在任务运行期间点击取消以中断采集。
  $('cancelBtn').disabled = false;
  $('result').classList.add('hidden');
  $('progress').classList.remove('hidden');
  $('stage').className = 'stage';
  $('stage').innerHTML = '<span class="spin"></span>准备中…';
  $('log').textContent = '';
  try {
    const resp = await fetch('/api/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        keyword: kw,
        mode: document.querySelector('input[name=mode]:checked').value,
        force: $('force').checked,
      }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || '请求失败');
    const { job_id } = await resp.json();
    currentJobId = job_id;
    poll(job_id);
  } catch (e) {
    $('stage').className = 'stage err';
    $('stage').textContent = '发起失败：' + e.message;
    $('btn').disabled = false;
  }
}

async function poll(id) {
  const resp = await fetch('/api/jobs/' + id);
  const job = await resp.json();
  $('stage').innerHTML = job.status === 'running'
    ? '<span class="spin"></span>' + job.stage
    : job.stage;
  $('log').textContent = (job.log || []).join('\n');
  $('log').scrollTop = $('log').scrollHeight;
  if (job.status === 'running') { setTimeout(() => poll(id), 2000); return; }
  $('btn').disabled = false;
  $('tripBtn').disabled = false;
  currentJobId = null;
  if (job.status === 'cancelled') {
    $('stage').className = 'stage err';
    $('stage').textContent = '任务已取消（浏览器与采集资源已释放）';
    return;
  }
  if (job.status === 'error') {
    $('stage').className = 'stage err';
    $('stage').textContent = '任务失败：' + job.error;
    return;
  }
  $('progress').classList.add('hidden');
  const r = job.result, s = r.stats;
  $('result').classList.remove('hidden');
  $('dl').href = '/api/reports/download?name=' + encodeURIComponent(r.report_name);
  $('stats').innerHTML =
    `<span>关键词 <b>${job.keyword}</b></span><span>视频 <b>${s.videos}</b> 条</span>` +
    `<span>评论 <b>${s.comments}</b> 条</span><span>要点 <b>${s.points}</b> 条</span>` +
    `<span>耗时 <b>${s.elapsed}</b> 秒</span>` +
    (r.cache_hit ? '<span>⚡ 知识库命中，免采集</span>' : '<span>🆕 本次全新采集</span>') +
    `<span>文件：${r.report_name}</span>`;
  $('report').innerHTML = renderMd(r.markdown);
  window.scrollTo({ top: $('result').offsetTop - 20, behavior: 'smooth' });
  loadHistory();
}

async function goTrip() {
  const city = $('city').value.trim();
  const days = parseInt($('days').value || '2', 10);
  if (!city) { $('city').focus(); return; }
  if (!days || days < 1 || days > 7) { alert('天数需在 1~7 之间'); return; }
  const spots = $('spots').value.trim();
  $('tripBtn').disabled = true;
  $('cancelBtn').disabled = false;
  $('result').classList.add('hidden');
  $('progress').classList.remove('hidden');
  $('stage').className = 'stage';
  $('stage').innerHTML = '<span class="spin"></span>准备中…';
  $('log').textContent = '';
  try {
    const resp = await fetch('/api/trip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        city: city,
        days: days,
        hotel: $('hotel').value.trim(),
        spots: spots ? spots.split(/[,，、]/).map(s => s.trim()).filter(Boolean) : null,
        preferences: $('prefs').value.trim(),
      }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || '请求失败');
    const { job_id } = await resp.json();
    currentJobId = job_id;
    poll(job_id);
  } catch (e) {
    $('stage').className = 'stage err';
    $('stage').textContent = '发起失败：' + e.message;
    $('tripBtn').disabled = false;
  }
}

async function cancelJob() {
  if (!currentJobId) return;
  $('cancelBtn').disabled = true;
  try {
    const resp = await fetch(`/api/jobs/${currentJobId}/cancel`, { method: 'POST' });
    if (!resp.ok) throw new Error((await resp.json()).detail || '取消失败');
    $('stage').innerHTML = '<span class="spin"></span>正在取消（当前步骤结束后生效）…';
  } catch (e) {
    alert('取消失败：' + e.message);
    $('cancelBtn').disabled = false;
  }
}

async function loadHistory() {
  try {
    const resp = await fetch('/api/reports');
    const { reports } = await resp.json();
    if (!reports || !reports.length) return;
    $('history').classList.remove('hidden');
    $('hist').innerHTML = reports.map(r =>
      `<li><span class="kw" onclick="viewReport('${encodeURIComponent(r.report_path)}')">${r.keyword}</span>` +
      `<span class="meta">${(r.reported_at || '').replace('T', ' ')} · 视频 ${r.video_count} · 评论 ${r.comment_count}</span>` +
      `<a class="mini-btn" download href="/api/reports/download?name=${encodeURIComponent(r.report_path)}">下载</a></li>`
    ).join('');
  } catch (e) { /* 历史加载失败不影响主流程 */ }
}

async function viewReport(name) {
  const resp = await fetch('/api/reports/download?name=' + name);
  if (!resp.ok) { alert('报告文件不存在或已被删除'); return; }
  const md = await resp.text();
  $('result').classList.remove('hidden');
  $('dl').href = '/api/reports/download?name=' + encodeURIComponent(decodeURIComponent(name));
  $('stats').innerHTML = `<span>文件：${decodeURIComponent(name)}</span>`;
  $('report').innerHTML = renderMd(md);
  window.scrollTo({ top: $('result').offsetTop - 20, behavior: 'smooth' });
}

loadHistory();
</script>
</body>
</html>
